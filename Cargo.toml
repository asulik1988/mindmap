[package]
name = "mindmap"
version = "0.1.3"
edition = "2021"
description = "A hand-drawn mind mapping tool for FreeMind .mm files"
readme = "README.md"
license = "MIT"
repository = "https://github.com/asulik1988/mindmap"
authors = ["Adam Sulik"]

[dependencies]
eframe = "0.31"
egui = "0.31"
quick-xml = "0.37"
rfd = "0.15"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
resvg = "0.40"

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
maintainer = "Adam Sulik"
section = "utils"
depends = "$auto"
assets = [
    ["target/release/mindmap", "usr/bin/", "755"],
    ["linux/mindmap.desktop", "usr/share/applications/", "644"],
    ["assets/mindmap.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[profile.release]
opt-level = 3
lto = "thin"
