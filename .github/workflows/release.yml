name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\mindmap-installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/installer/mindmap-${{ steps.version.outputs.version }}-setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build ARM binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64 binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/mindmap \
            target/x86_64-apple-darwin/release/mindmap \
            -output mindmap

      - name: Assemble app bundle
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p Mindmap.app/Contents/MacOS
          mkdir -p Mindmap.app/Contents/Resources
          cp mindmap Mindmap.app/Contents/MacOS/mindmap
          sed "s/__VERSION__/$VERSION/g" macos/Info.plist > Mindmap.app/Contents/Info.plist
          cp assets/mindmap.icns Mindmap.app/Contents/Resources/mindmap.icns

      - name: Create DMG
        run: |
          VERSION=${{ steps.version.outputs.version }}
          brew install create-dmg
          create-dmg \
            --volname "Mindmap" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Mindmap.app" 150 190 \
            --app-drop-link 450 190 \
            "mindmap-${VERSION}-macos-universal.dmg" \
            Mindmap.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: mindmap-${{ steps.version.outputs.version }}-macos-universal.dmg

  release:
    if: github.ref_type == 'tag' && contains(github.event.base_ref, 'refs/heads/master') || github.ref_type == 'tag' && github.event.base_ref == ''
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "::error::Tag is not on master branch. Skipping release."
            exit 1
          fi

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-installer/mindmap-${{ steps.version.outputs.version }}-setup.exe
            artifacts/macos-dmg/mindmap-${{ steps.version.outputs.version }}-macos-universal.dmg
